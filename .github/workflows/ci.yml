# Minimal CI for SHD: numpy/scipy/scikit-learn only, no private artifacts.
#
# Runs on every push and PR. Two-tier strategy mirrors the repo's own doctrine
# (tests/run_smoke.py header): the CPU-cheap dependency-free smoke tier gates
# everything; the full pytest tier runs on 3.10 + the oldest supported NumPy
# (1.24) and on 3.12 + the newest NumPy, catching both ends of the support
# window.
#
# Guards (all cheap, all would have caught past releases):
# * pip install -e .  -- packaging metadata (pyproject) must stay installable;
#   this is where a stale "version =" would break first.
# * tests/run_smoke.py  -- dependency-free tier, exact PASS/FAIL lines.
# * pytest tests -q  -- the full suite (golden numbers included).
# * tools/verify_claims.py  -- README/paper/artifact claims audit (474 checks),
#   including the version-carriers-agree invariant.
#
# The MetroPT-3 / PM2.5 / superconduct artifacts live in git (58 files under
# paper/, artifacts/ and *.json), so verify_claims runs with the same inputs it
# had at release time.

name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (editable, pulls numpy/scipy/scikit-learn)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Dependency-free smoke tier
        run: python tests/run_smoke.py

  full:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # oldest supported stack: requires-python floor + NumPy 1.24
          - python-version: "3.10"
            numpy-pin: "numpy==1.24.*"
          # current stack
          - python-version: "3.12"
            numpy-pin: "numpy"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest "${{ matrix.numpy-pin }}"
      - name: Full pytest suite
        run: python -m pytest tests -q
      - name: Claims audit (README/paper vs artifacts)
        run: python tools/verify_claims.py
