[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-hologram-distiller"
version = "3.12.0"
description = "Zero-GPU streaming dataset distillation with phase-manifold Voronoi medoids and a 16-bit spectral-passport OOD radar."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SIA SHD" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
shd = "shd.cli:main"

[tool.setuptools.packages.find]
include = ["shd*"]
